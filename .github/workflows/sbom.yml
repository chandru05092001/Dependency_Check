name: SBOM Generation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-sbom:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM (Native npm)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.json

      - name: Smart Upload to Dependency-Track
        shell: powershell
        run: |
          # 1. Find the correct API Port
          $ApiUrl = ""
          $Ports = @(8081, 8080)
          
          foreach ($Port in $Ports) {
              $TestUrl = "http://localhost:$Port/api/version"
              try {
                  $Response = Invoke-RestMethod -Uri $TestUrl -Method Get -ErrorAction Stop
                  if ($Response.version) {
                      Write-Host "✅ Found Dependency-Track API on port $Port (Version: $($Response.version))"
                      $ApiUrl = "http://localhost:$Port/api/v1/bom"
                      break
                  }
              } catch {
                  Write-Host "❌ API not found on port $Port"
              }
          }
          
          if ($ApiUrl -eq "") {
              Write-Error "Could not find Dependency-Track API on port 8080 or 8081. Is the Docker container running?"
              exit 1
          }

          # 2. Convert the SBOM to Base64
          $BomContents = Get-Content -Path "sbom.json" -Raw
          $BomBytes = [System.Text.Encoding]::UTF8.GetBytes($BomContents)
          $BomBase64 = [System.Convert]::ToBase64String($BomBytes)
          
          # 3. Create the JSON payload
          $Payload = @{
              projectName = "Dependency_Check"
              projectVersion = "latest"
              autoCreate = $true
              bom = $BomBase64
          } | ConvertTo-Json -Depth 10
          
          # 4. Upload the SBOM
          Write-Host "🚀 Uploading SBOM to $ApiUrl ..."
          Invoke-RestMethod -Uri $ApiUrl `
                            -Method Put `
                            -Headers @{ "X-Api-Key" = "${{ secrets.DTRACK_API_KEY }}" } `
                            -ContentType "application/json" `
                            -Body $Payload
          Write-Host "🎉 Upload Complete!"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

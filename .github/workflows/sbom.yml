name: SBOM Generation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-sbom:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM to Dependency-Track
        shell: powershell
        run: |
          $headers = @{
              "X-Api-Key" = "${{ secrets.DTRACK_API_KEY }}"
          }
          $form = @{
              autoCreate = "true"
              projectName = "Dependency_Check"
              projectVersion = "latest"
              bom = Get-Item -Path "sbom.json"
          }
          Invoke-RestMethod -Uri "${{ secrets.DTRACK_URL }}/api/v1/bom" -Method Post -Headers $headers -Form $form

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
